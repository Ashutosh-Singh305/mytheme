{% extends 'crm/base.html' %}
{% block title %}Delete Follow-up{% endblock %}
{% block body %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-header bg-danger text-white text-center">
        <h4 class="mb-0">Confirm Delete</h4>
      </div>
      <div class="card-body text-center">
        <p class="fs-5">
          Are you sure you want to delete the follow-up for 
          <strong class="text-danger">{{ followup.lead.name }}</strong>?
        </p>
        <form method="post" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger btn-sm px-4 me-2">
            Yes, Delete
          </button>
        </form>
        <a href="javascript:history.back()" class="btn btn-secondary btn-sm px-4">
          Cancel
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
