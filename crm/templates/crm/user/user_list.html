{% extends 'crm/base.html' %}
{% load static %}
{% block title %} User List{% endblock %}
{% block css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/list.css' %}">
<style>
    .loader-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
    }

    #tableContainer {
        position: relative;
    }

    .sort-icon {
        font-size: 12px;
    }
</style>
{% endblock css %}
{% block body %}
<!-- HEADER -->
<div class="page-header d-flex justify-content-between align-items-center mb-3">
    <h3 class="page-title">
        <i class="fa fa-users mr-2"></i> Users
    </h3>

    <a href="{% url 'user-create' %}" class="btn btn-primary btn-sm">
        <i class="fa fa-user-plus"></i> Create User
    </a>
</div>

<div class="card">
    <div class="card-body">
        <div class="row align-items-center mb-3">

            <!-- SEARCH -->
            <div class="col-md-3 mb-2">

                <input type="text" class="form-control form-control-sm" id="myInput" placeholder="Search users...">

            </div>

            <!-- STATUS -->
            <div class="col-md-3 mb-2">

                <select name="status" id="statusFilter" class="form-control form-control-sm">

                    <option value="">All Users</option>

                    <option value="active" {% if current_status == 'active' %}selected{% endif %}>
                        Active
                    </option>

                    <option value="inactive" {% if current_status == 'inactive' %}selected{% endif %}>
                        Inactive
                    </option>

                </select>

            </div>

            <!-- ROLE -->
            <div class="col-md-3 mb-2">

                <select name="role" id="roleFilter" class="form-control form-control-sm">

                    <option value="">All Roles</option>

                    {% for role in roles %}
                        <option value="{{ role.id }}">
                            {{ role.name }}
                        </option>
                    {% endfor %}

                </select>

            </div>

            <!-- BRANCH -->
            <div class="col-md-3 mb-2">

                <select name="branch"
                        id="branchFilter"
                        class="form-control form-control-sm">

                    <option value="">All Branches</option>

                    {% for branch in branches %}

                    <option value="{{ branch.id }}"
                        {% if current_branch == branch.id|stringformat:"s" %}
                            selected
                        {% endif %}>

                        {{ branch.name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

        </div>
        <!-- TABLE -->
        <div id="tableContainer">
            {% include 'crm/user/user_table_partial.html' %}
        </div>



    </div>
</div>

{% endblock body %}

{% block Script %}
<script>
    let currentPage = 1;
    let currentSort = "date_joined";
    let currentDir = "desc";
    let currentStatus = "";
    let currentRole = "";
    let currentBranch = "";
    let currentSearch = "";

    function updateSortIcons() {
        $(".sort-icon")
            .removeClass("fa-sort-up fa-sort-down")
            .addClass("fa-sort");

        $(`.sort[data-field='${currentSort}'] .sort-icon`)
            .removeClass("fa-sort")
            .addClass(currentDir === "asc" ? "fa-sort-up" : "fa-sort-down");
    }

    function loadData() {
        $("#loader").show();

        $.ajax({
            url: "",
            data: {
                page: currentPage,
                sort: currentSort,
                dir: currentDir,
                status: currentStatus,
                role: currentRole,
                branch: currentBranch,
                search: currentSearch
            },
            success: function (response) {
                $("#tableContainer").html(response.html);
                updateSortIcons();
            },
            complete: function () {
                $("#loader").hide();
            }
        });
    }

    // FILTER
    $("#statusFilter").change(function () {
        currentStatus = $(this).val();
        currentPage = 1;
        loadData();
    });

    // SEARCH (debounced)
    let timer;
    $("#myInput").keyup(function () {
        clearTimeout(timer);
        currentSearch = $(this).val();

        timer = setTimeout(() => {
            currentPage = 1;
            loadData();
        }, 400);
    });

    // FILTER
    $("#roleFilter").change(function () {
        currentRole = $(this).val();
        currentPage = 1;
        loadData();
    });

    // FILTER
    $("#branchFilter").change(function () {
        currentBranch = $(this).val();
        currentPage = 1;
        loadData();
    });

    // SORT CLICK
    $(document).on("click", ".sort", function (e) {
        e.preventDefault();

        let field = $(this).data("field");

        if (currentSort === field) {
            currentDir = currentDir === "asc" ? "desc" : "asc";
        } else {
            currentSort = field;
            currentDir = "asc";
        }

        loadData();
    });

    

    // PAGINATION
    $(document).on("click", ".page-link", function (e) {
        e.preventDefault();
        currentPage = $(this).data("page");
        loadData();
    });
</script>
{% endblock Script %}
