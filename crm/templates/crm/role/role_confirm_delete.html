{% extends 'crm/base.html' %}
{% block title %} Role Delete{% endblock %}
{% block body %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-danger shadow-sm mt-5">
            <div class="card-body text-center py-4">
                <div class="text-danger mb-3">
                    <i class="bi bi-exclamation-triangle display-4"></i>
                </div>
                <h4 class="card-title mb-3">Delete Role?</h4>
                <p class="text-muted">
                    Are you sure you want to delete the role <strong>"{{ object.name }}"</strong>? This action cannot be undone.
                </p>
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'role-list' %}" class="btn btn-light border">No, Go Back</a>
                        <button type="submit" class="btn btn-danger">Yes, Delete Permanently</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
