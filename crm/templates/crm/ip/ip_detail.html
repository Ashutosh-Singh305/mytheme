<!-- TOP SUMMARY CARD -->
<div class="card border-0 shadow-sm mb-2">
  <div class="card-body">

    <div class="d-flex justify-content-between align-items-center flex-wrap">

      <div>
        <h5 class="mb-1 text-primary fw-semibold">
          {{ ip.start_ip }} - {{ ip.end_ip }}
        </h5>
      </div>

      <div class="mt-2 mt-md-0">
        <a href="{% url 'ip-edit' ip.pk %}" class="btn btn-primary btn-sm">

          <i class="fas fa-pen me-1"></i>
          Edit
        </a>

        <a href="{% url 'ip-delete' ip.pk %}" class="btn btn-danger btn-sm"
          onclick="return confirm('Are you sure you want to delete this record?');">

          <i class="fas fa-trash me-1"></i>
          Delete
        </a>

        <a href="{% url 'ip-list' %}" class="btn btn-secondary btn-sm">

          <i class="fas fa-arrow-left me-1"></i>
          Back
        </a>

      </div>

    </div>

  </div>
</div>

<!-- TABS CARD -->
<div class="card shadow-sm">
  <div class="card-body">
    <!-- TABS -->
    <div class="ms-2">

      <ul class="nav nav-tabs card-header-tabs" id="detailTabs" role="tablist">

        <li class="nav-item">

          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#general" type="button">

            General
          </button>
        </li>

        <!-- <li class="nav-item">

      </ul>

    </div>

    <!-- TAB CONTENT -->
    <div class="card-body">

      <div class="tab-content">

        <!-- GENERAL TAB -->
        <div class="tab-pane fade show active" id="general">

          <div class="row">

            <label class="col-md-3">
              Start IP
            </label>

            <div class="col-md-9 fw-medium">
              {{ ip.start_ip }}
            </div>

          </div>

          <div class="row">

            <label class="col-md-3">
              End IP
            </label>

            <div class="col-md-9 fw-medium">
              {{ ip.end_ip }}
            </div>

          </div>

          <div class="row">

            <label class="col-md-3">
              Status
            </label>

            <div class="col-md-9">

              {% if ip.is_active %}
              <span class="badge bg-success">
                Active
              </span>
              {% else %}
              <span class="badge bg-secondary">
                Inactive
              </span>
              {% endif %}

            </div>

          </div>

        </div>
