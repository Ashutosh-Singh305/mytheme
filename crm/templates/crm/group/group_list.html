{% extends 'crm/base.html' %}
{% block title %}Group Management{% endblock title %}
{% block body %}
<div class="card border-0 shadow-sm mb-3">
    <div class="card-body d-flex justify-content-between align-items-center bg-white text-dark py-3">

        <!-- Left Side: Title & Icon -->
        <div class="d-flex align-items-center gap-2">
            <h4 class="mb-0 fw-bold text-dark d-flex align-items-center gap-2 fs-5">
                <!-- <i class="fa fa-network-wired opacity-90"></i>  -->
                <span class="opacity-90">Group Management</span>
            </h4>
        </div>

        <!-- Right Side: Action Button -->
        <div class="flex-shrink-0">
            <a href="{% url 'group-create' %}" class="btn btn-primary btn-sm px-3 d-flex align-items-center gap-2 text-nowrap">
                <i class="bi bi-plus-lg"></i> Add Group
            </a>
        </div>

    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <div class="table-responsive rounded-top-4">
            <table class="table align-middle mb-0">
                <thead class="table-primary fs-7">
                    <tr>
                        <th scope="col" class="ps-3">ID</th>
                        <th scope="col">Name</th>
                        <th scope="col" class="text-end pe-3">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for group in groups %}
                    <tr>
                        <td class="fw-bold ps-3">{{ group.id }}</td>
                        <td>{{ group.name }}</td>
                        <td class="text-end pe-3">
                            <div class="d-inline-flex gap-1">
                                <a href="{% url 'group-update' group.id %}" class="btn btn-sm btn-outline-info">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a href="{% url 'group-delete' group.id %}" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center text-muted py-4">
                            <i class="bi bi-folder-x display-6 d-block mb-2"></i>
                            No groups found.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
