{% extends 'crm/base.html' %}
{% block body %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h4 class="page-title mb-0">Group Management</h4>
    </div>
    <div>
        <a href="{% url 'group-create' %}" class="btn btn-primary btn-sm d-inline-flex align-items-center gap-1">
            <i class="bi bi-plus-lg"></i>
            Add Group
        </a>
    </div>
</div>

<div class="card shadow-sm">
    <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
            <thead class="table-primary fs-7">
                <tr>
                    <th scope="col" class="ps-3">ID</th>
                    <th scope="col">Name</th>
                    <th scope="col" class="text-end pe-3">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for group in groups %}
                <tr>
                    <td class="fw-bold ps-3">{{ group.id }}</td>
                    <td>{{ group.name }}</td>
                    <td class="text-end pe-3">
                        <div class="d-inline-flex gap-1">
                            <a href="{% url 'group-update' group.id %}" class="btn btn-sm btn-outline-info">
                                <i class="bi bi-pencil-square"></i> 
                            </a>
                            <a href="{% url 'group-delete' group.id %}" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i> 
                            </a>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">
                        <i class="bi bi-folder-x display-6 d-block mb-2"></i>
                        No groups found.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
