{% extends 'base.html' %} 

{% block title %} Contact Us {% endblock title %} 

{% block body %}
<div class="container-fluid px-0 mb-3">
  <img src="/static/img/crl1.png" class="d-block w-100 mx-0" style="height: 500px" alt="..." />
  <h1 class="text-center">Contact Us</h1>
</div>
<div class="container p-2">
  
  <form method="post" action="" >
     {% csrf_token %}
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name">
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="phone" class="form-control" id="phone" name="phone" placeholder="Enter your phone number">
    </div>

    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com">
    </div>
    
    <div class="form-group">
      <label for="desc">Tell me about your requirement...</label>
      <textarea class="form-control" id="desc" name="desc" rows="3"></textarea>
    </div>
    <button class="btn btn-primary mt-4 center" type="submit" >Submit </button>
  </form>
</div>
{% endblock body %}
