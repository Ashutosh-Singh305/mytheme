<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts for accurate typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css">
</head>

<body>

    <div class="container">
            <!-- Left Panel -->
            <div class="left-panel">
                <div class="login-box">
                    <h2>Welcome Back!</h2>
                    <p class="subtitle">Please login to your account.</p>

                    <form method="post" action="{% url 'login' %}?next={{ request.GET.next }}">
                        {% csrf_token %}

                        <div class="form-group">
                            <i class="far fa-user input-icon"></i>
                            <input type="text" name="username" placeholder="username" autocomplete="username">
                            <small class="text-danger">{{ form.username.errors|striptags }}</small>
                        </div>

                        <div class="form-group password-wrapper">
                            <i class="layer-group fas fa-lock input-icon"></i>
                            <input type="password" name="password" placeholder="••••••••••••" id="passwordField"
                                autocomplete="current-password">
                            <span class="toggle-password" id="togglePassword">
                                <i class="far fa-eye"></i>
                            </span>
                            <small class="text-danger">{{ form.password.errors|striptags }}</small>
                        </div>

                        <div class="remember-forgot">
                            <label class="remember-checkbox">
                                <input type="checkbox" name="remember_me"> Remember me
                            </label>
                            <div class="forgot-password">
                                <a href="{% url 'password_reset' %}">Forgot password?</a>
                            </div>
                        </div>

                        <button type="submit" class="login-btn">Login</button>

                        {% if form.non_field_errors %}
                        <div class="alert alert-danger">
                            {% for error in form.non_field_errors %}
                            <p>{{ error }}</p>
                            {% endfor %}
                        </div>
                        {% endif %}
                    </form>
                </div>
            </div>

            <!-- Right Panel (Background decorative layout) -->
            <div class="right-panel"></div>
        </div>

    <!-- Interactive script to toggle password eye icon state -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const togglePassword = document.getElementById('togglePassword');
            const passwordField = document.getElementById('passwordField');

            togglePassword.addEventListener('click', function () {
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);

                const icon = this.querySelector('i');
                if (type === 'password') {
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                } else {
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                }
            });
        });
    </script>
</body>

</html>
