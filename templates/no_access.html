<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <div class="container-scroller">
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-danger text-white">
      
      <div class="container">
        <div class="row">
          <div class="col-lg-7 mx-auto text-center">

            <div class="row align-items-center g-4">
              
              <div class="col-lg-6 text-lg-end pe-lg-4">
                <h1 class="display-1 mb-0">
                  <i class="fa fa-ban text-danger"></i>
                </h1>
              </div>

              <div class="col-lg-6 text-lg-start ps-lg-4 border-lg-start border-white border-opacity-25">
                <h2 class="mb-2 fw-bold">Access Denied</h2>
                <h4 class="fw-light text-warning text-opacity-75">
                  You are not allowed to login from this IP address.
                </h4>
              </div>

            </div>

            <div class="row mt-4">
              <div class="col-12">
                <p class="text-warning text-opacity-50 mb-0">
                  <strong>Your IP : </strong> <span class="font-monospace text-warning">{{ ip }}</span>
                </p>
              </div>
            </div>

            <div class="row mt-4">
              <div class="col-md-9 mx-auto">
                <div class="alert alert-light  shadow-sm" role="alert">
                  Please contact your administrator or connect from an authorized network.
                </div>
              </div>
            </div>

            <div class="row mt-3">
              <div class="col-12">
                <a href="{% url 'login' %}" class="btn btn-primary btn-sm px-4 py-2 fw-semibold shadow-sm">
                  Back to Login
                </a>
              </div>
            </div>

            <div class="row mt-5">
              <div class="col-12">
                <p class="text-opacity-50 small mb-0">
                  If you believe this is an error, please reach out to IT support.
                </p>
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
