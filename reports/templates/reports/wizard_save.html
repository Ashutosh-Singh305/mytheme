{% extends "reports/base.html" %}
{% block title %}Save Report{% endblock %}
{% block body %}
<div class="card">
  <div class="card-body">
    <!-- Dynamic Breadcrumb -->
    <div class="mb-3">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          {% for label, url in breadcrumbs %}
            {% if url %}
              <li class="breadcrumb-item">
                <a href="{{ url }}">{{ label }}</a>
              </li>
            {% else %}
              <li class="breadcrumb-item active" aria-current="page">
                {{ label }}
              </li>
            {% endif %}
          {% endfor %}
        </ol>
      </nav>
    </div>

    <h4 class="card-title">Save Report</h4>
    <form method="post">{% csrf_token %}
      <div class="form-group">
        <label for="name">Report Name</label>
        <input id="name" name="name" class="form-control" placeholder="e.g. Leads by Owner / Month" value="{{ name }}" required>
        <label for="name">Count</label>
        <input type="number" label="Count" class="form-control" name="limit" value="{{ limit }}">
      </div>
      <button class="btn btn-success btn-sm" type="submit">Save & Run</button>
    </form>
  </div>
</div>
{% endblock %}
