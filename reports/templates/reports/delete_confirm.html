{% extends "reports/base.html" %}

{% block title %}Delete Report — {{ report.name }}{% endblock %}

{% block body %}
<div class="card">
  <div class="card-body">
    <h4 class="card-title mb-3">Delete “{{ report.name }}”</h4>
    <p>Are you sure you want to delete this report? This action cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <a class="btn btn-outline-secondary" href="{% url 'reports:list' %}">Cancel</a>
      <button class="btn btn-danger" type="submit">Delete</button>
    </form>
  </div>
</div>
{% endblock %}
