{% extends 'crm/base.html' %}

{% block title %} {{ title }} {% endblock %}

{% block body %}
<div class="row">
    <div class="col-12 grid-margin">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">{{ title }}</h4>

                <form method="post" enctype="multipart/form-data" class="form-sample">
                    {% csrf_token %}
                    <p class="card-description">Bank Information</p>

                    <div class="row">
                        {% for field in form %}
                        <div class="col-md-6 mb-3">
                            <div class="form-group row">
                                <label class="col-sm-4 col-form-label" for="{{ field.id_for_label }}">
                                    {{ field.label }}
                                    {% if field.field.required %}
                                    <span class="text-danger">*</span>
                                    {% endif %}
                                </label>
                                <div class="col-sm-8">
                                    {{ field }}
                                    {% if field.errors %}
                                    <div class="text-danger small">{{ field.errors|join:", " }}</div>
                                    {% endif %}
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>

                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary btn-sm">Save</button>
                        <a href="{% url 'bank_list' %}" class="btn btn-secondary btn-sm">Back</a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
