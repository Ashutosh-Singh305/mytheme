{% extends 'crm/base.html' %}
{% block title %}Change Password{% endblock title %}
{% block css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
{% endblock css %}
{% block body %}
<div class="container-scroller">
    <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="content-wrapper d-flex align-items-center justify-content-center bg-primary text-white py-5">
            <div class="text-center">
                <div class="mb-4">
                    <h2 class="display-5 fw-bold">Password Changed</h2>
                    <p class="fs-5">Your password has been updated successfully.</p>
                </div>
                <a href="{% url 'my_profile' %}" class="btn btn-light fw-medium">Back to Profile</a>
            </div>
        </div>
    </div>
</div>
{% endblock body %}

{% endblock Script %}
