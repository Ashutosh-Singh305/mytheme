{% extends 'crm/base.html' %}
{% block body %}
<div class="container mt-5">
    <div class="card card-danger card-outline shadow-sm col-md-6 mx-auto">
        <div class="card-body text-center">
            <h4>Are you sure you want to delete "{{ group.name }}"?</h4>
            <p class="text-muted">This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <a href="{% url 'group-list' %}" class="btn btn-default border px-4">Cancel</a>
                <button type="submit" class="btn btn-danger px-4">Confirm Delete</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
